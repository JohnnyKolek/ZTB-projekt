# Konfiguracja PostgreSQL dla benchmarku ZTBD
# Założenie: kontener ma limit 6 GB RAM i 4 CPU (patrz infra/.env).
# Zmieniając limity w .env, przeskalujcie też wartości pamięci poniżej.

listen_addresses = '*'
max_connections = 200                 # zapas na testy współbieżności (do 100 wątków)

# --- Pamięć -------------------------------------------------------------
shared_buffers = 3GB                  # cache danych: tyle samo co w MariaDB/MongoDB/Neo4j
effective_cache_size = 4500MB         # podpowiedź dla planera (shared_buffers + cache OS)
work_mem = 32MB                       # na operację sortowania/hasha w zapytaniu
maintenance_work_mem = 1GB            # szybsze CREATE INDEX i VACUUM

# --- Trwałość zapisu (NIE wyłączać – porównanie musi być uczciwe) -------
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = minimal                   # brak replikacji -> mniej WAL, szybszy COPY
max_wal_senders = 0

# --- Checkpointy (ładowanie dużych zbiorów) ----------------------------
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- Planer (dysk SSD) --------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Równoległość -------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2

# --- Diagnostyka ----------------------------------------------------------
track_io_timing = on                  # czasy I/O w EXPLAIN (ANALYZE, BUFFERS)
log_min_duration_statement = -1       # bez logowania zapytań – nie obciąża pomiarów
log_timezone = 'UTC'
timezone = 'UTC'
