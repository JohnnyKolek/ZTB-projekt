# ZTBD – infrastruktura testowa
# Każda baza ma własny profil i uruchamiamy je POJEDYNCZO (testy po kolei).
# Wszystkie kontenery dostają identyczny limit CPU/RAM z pliku .env.
#
#   docker compose --profile postgres up -d --wait
#   docker compose --profile postgres down
#
# Wygodniej przez skrypt: ../scripts/db.sh up postgres

name: ztbd

x-db-common: &db-common
  restart: "no"
  cpus: ${DB_CPUS:-4}
  mem_limit: ${DB_MEMORY:-6g}
  memswap_limit: ${DB_MEMORY:-6g}   # bez swapu – swap zafałszowałby pomiary
  stop_grace_period: 60s            # czas na flush danych przy zatrzymaniu
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:

  postgres:
    <<: *db-common
    profiles: ["postgres"]
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: ztbd-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-bench}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bench_pass}
      POSTGRES_DB: ${DB_NAME:-ecommerce}
      # Porównanie napisów binarne (kolejność kodów Unicode), jak utf8mb4_bin w MariaDB,
      # MongoDB i Neo4j. Działa tylko przy tworzeniu pustej bazy (db.sh reset postgres).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    shm_size: 1g                    # domyślne 64 MB to za mało dla zapytań równoległych
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../data:/data-import:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  mariadb:
    <<: *db-common
    profiles: ["mariadb"]
    image: mariadb:${MARIADB_VERSION:-12.3}
    container_name: ztbd-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
      MARIADB_USER: ${DB_USER:-bench}
      MARIADB_PASSWORD: ${DB_PASSWORD:-bench_pass}
      MARIADB_DATABASE: ${DB_NAME:-ecommerce}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
      - ../data:/data-import:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongodb:
    <<: *db-common
    profiles: ["mongodb"]
    image: mongo:${MONGODB_VERSION:-8.0}
    container_name: ztbd-mongodb
    # Jednowęzłowy replica set – bez niego MongoDB nie obsługuje transakcji
    # (potrzebne np. w scenariuszu "zamówienie + pozycje w jednej transakcji").
    command: ["mongod", "--config", "/etc/mongod.conf"]
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/mongod.conf:/etc/mongod.conf:ro
      - ../data:/data-import:ro
    healthcheck:
      # Przy pierwszym starcie inicjalizuje replica set, potem tylko sprawdza status.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  neo4j:
    <<: *db-common
    profiles: ["neo4j"]
    image: neo4j:${NEO4J_VERSION:-2026.10}
    container_name: ztbd-neo4j
    environment:
      NEO4J_AUTH: neo4j/${DB_PASSWORD:-bench_pass}
      # Pamięć: heap na wykonywanie zapytań + page cache na dane.
      # Page cache = tyle samo co cache danych w pozostałych bazach (3 GB).
      NEO4J_server_memory_heap_initial__size: 1536m
      NEO4J_server_memory_heap_max__size: 1536m
      NEO4J_server_memory_pagecache_size: 3g
      NEO4J_server_directories_import: /import
      NEO4J_db_logs_query_enabled: "OFF"
      # APOC przydaje się do masowych UPDATE/DELETE (apoc.periodic.iterate).
      # Odkomentujcie, jeśli zdecydujecie się go używać – wymaga internetu przy starcie.
      # NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ../data:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s

volumes:
  postgres_data:
    name: ztbd_postgres_data
  mariadb_data:
    name: ztbd_mariadb_data
  mongodb_data:
    name: ztbd_mongodb_data
  neo4j_data:
    name: ztbd_neo4j_data
  neo4j_logs:
    name: ztbd_neo4j_logs
