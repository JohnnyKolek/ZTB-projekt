# Konfiguracja MongoDB dla benchmarku ZTBD
# Założenie: kontener ma limit 6 GB RAM i 4 CPU (patrz infra/.env).

net:
  port: 27017
  bindIpAll: true

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 3          # cache danych: tyle samo co w pozostałych bazach
  # Dziennik (journal) jest w MongoDB 8 zawsze włączony.

# Jednowęzłowy replica set – wymagany do transakcji wielodokumentowych.
# Inicjalizuje go healthcheck w docker-compose.yml.
replication:
  replSetName: rs0

operationProfiling:
  mode: "off"                 # profiler włączajcie tylko na czas analizy explain

# UWAGA – trwałość zapisu ustawia się po stronie klienta, w connection stringu:
#   mongodb://localhost:27017/ecommerce?directConnection=true&w=1&journal=true
# journal=true = zapis potwierdzony dopiero po zapisie do dziennika na dysku,
# czyli odpowiednik synchronous_commit / innodb_flush_log_at_trx_commit=1.
